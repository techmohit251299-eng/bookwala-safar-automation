name: Generate Book Script & Voice

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      

      - name: Generate Script & Voice
        run: python generate_script_anthropic.py
        env:
         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
         ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
         ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

      # Manual video editing in DaVinci/Premiere - script + voice only
      # - name: Generate thumbnail
      #   run: python generate_thumbnail.py
      # - name: Publish to YouTube
      #   run: python scripts/publish.py

      - name: Commit script & voice
        run: |
          git config user.name "video-automation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/books.json data/selected_book.json data/script.json output/voice.mp3
          git commit -m "chore: generated script & voice for $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
