name: Generate Book Script & Voice

on:
  schedule:
    # Runs daily at 09:00 UTC (~2:30 PM IST). Change cron to adjust frequency.
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select today's book
        run: python scripts/select_book.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Generate script
        run: python scripts/generate_script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPT_MODE: full   # 10-12 min professional scripts

      - name: Generate voiceover (ElevenLabs)
        run: python scripts/generate_voice.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}

      # Manual video editing in DaVinci/Premiere - script + voice only
      # - name: Generate thumbnail
      #   run: python scripts/generate_thumbnail.py
      # - name: Publish to YouTube
      #   run: python scripts/publish.py

      - name: Commit script & voice
        run: |
          git config user.name "video-automation-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/books.json data/selected_book.json data/script.json output/voice.mp3
          git commit -m "chore: generated script & voice for $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
